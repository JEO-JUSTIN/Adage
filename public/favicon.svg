<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold-cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3" />
      <stop offset="35%" stop-color="#F3C649" />
      <stop offset="70%" stop-color="#C8922A" />
      <stop offset="100%" stop-color="#7A5210" />
    </linearGradient>

    <!-- Highlight Gradient -->
    <linearGradient id="gold-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Helmet Brim -->
    <filter id="helmet-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Hard Hat Main Dome (Construction Cap) -->
  <path
    d="M 12 58 C 12 24, 30 14, 50 14 C 70 14, 88 24, 88 58 Z"
    fill="url(#gold-cap-grad)"
    stroke="#8A5A10"
    stroke-width="1.5"
    filter="url(#helmet-shadow)"
  />

  <!-- Top Center Ridge / Crown Rib -->
  <path
    d="M 44 14 C 44 14, 46 48, 46 58 L 54 58 C 54 48, 56 14, 56 14 Z"
    fill="url(#gold-cap-grad)"
    stroke="#7A5210"
    stroke-width="1"
  />

  <!-- Dome Highlight Sheen -->
  <path
    d="M 22 50 C 22 30, 32 20, 44 17 C 36 24, 30 36, 30 52 Z"
    fill="url(#gold-shine)"
  />

  <!-- Hard Hat Front Visor / Brim -->
  <path
    d="M 4 58 C 15 54, 85 54, 96 58 C 100 64, 92 68, 84 68 C 58 64, 42 64, 16 68 C 8 68, 0 64, 4 58 Z"
    fill="url(#gold-cap-grad)"
    stroke="#66430A"
    stroke-width="1.5"
    filter="url(#helmet-shadow)"
  />

  <!-- Inner Headband Accent Line -->
  <path
    d="M 14 58 C 30 61, 70 61, 86 58"
    stroke="#4A3006"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>